<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixa</title>
    <style>
        body {
            background-color: bisque;
        }

        h1 {
            /*O modo de exibição desse cód. é apenas um exemplo, isso tudo poderia facilmente ser trocado por 'shorthands'*/
            background-color: rgb(196, 203, 255);
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: rgb(130, 126, 215);

            
            padding-top: 30px ;
            padding-bottom: 10px;
            padding-left: 30px;
            padding-right: 10px;

            margin-top: 10px;
            margin-bottom: 50px;
            margin-left: 10px;
            margin-right: 10px;

            /*Para centralizar a margem, pode ser usado o 'margin: auto'*/

            outline-width: 5px;
            outline-style: dashed;
            outline-color: black;
        }

        a {
            border-width: 10px;
            border-style: groove;
            /*Outras propriedades: Solid, dashed, dotted, double.*/
            border-color: brown;
            
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixas Box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de inline-level.</a>Vamos ver como tudo isso funciona?</p>    
</body>
</html>
