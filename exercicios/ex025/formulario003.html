<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
            background-color: lightcyan;
        }
    </style>
</head>
<body>
    <h1>Formulário com data</h1>
    <form action="" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required maxlength="30" autocomplete="name" size="15" placeholder="Digite seu nome">
        </p>
        <p>
            <label for="imed">Média:</label>
            <input type="number" name="med" id="imed" required max="10" min="0" placeholder="0 a 10" step="0.1" value="5">
        </p>
        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" required value="2026-09">
        </p>
            <label for="idata">Data da Prova</label>
            <input type="date" name="data" id="idata" required value="2026-09-23">
        </p>
        <p>
            <label for="ihora"></label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
