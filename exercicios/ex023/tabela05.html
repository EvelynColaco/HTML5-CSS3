<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupando Colunas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 900px; 
            height: 100px;
            border-collapse: collapse;
            text-align: center;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
            
        }

        th{
            background-color: rgba(128, 128, 128, 0.719);
        }
        .cnome{
            background-color: yellow;
        }
        .csexo{
            background-color: rebeccapurple;
        }
        div#content{
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="content">
        <table>
            <colgroup>
                <col class="cnome">
                <col class="csexo" span="2">
            </colgroup>
            <tr>
                <th>Nome</th>
                <th>Sexo</th>
                <th>Idade</th>
                <th>Estado</th>
                <th>Aniversário</th>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>M</td>
                <td>18</td>
                <td>Goiás</td>
                <td>12.05</td>
            </tr>
            <tr>
                <td>Julia</td>
                <td>F</td>
                <td>24</td>
                <td>Amazonas</td>
                <td>29.10</td>
            </tr>
            <tr>
                <td>Ana</td>
                <td>F</td>
                <td>30</td>
                <td>Pernanbuco</td>
                <td>14.03</td>
            </tr>
        </table>
    </div>
</body>
</html>
