<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupando Colunas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            height: 100px;
            border-collapse: collapse;
            text-align: center;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        th{
            background-color: rgba(128, 128, 128, 0.719);
        }
        .cnome{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
        </colgroup>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>M</td>
            <td>18</td>
        </tr>
        <tr>
            <td>Julia</td>
            <td>F</td>
            <td>24</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>F</td>
            <td>30</td>
        </tr>
    </table>
</body>
</html>
