<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        table{
            width: 500px; 
            height: 500px; 
            border-collapse: collapse;  
        }

        td{
            border: 1px solid black;
            text-align: center;
            vertical-align: middle; /* Somente o middle não deixa o conteúdo centralizado*/
            
        }

        .diagonal{
            background-color: rgba(137, 43, 226, 0.476);
        }

        .vertical{
            background-color: rgba(255, 255, 0, 0.631);
        }

        .horizontal{
            background-color: rgba(0, 128, 0, 0.495);
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>

    <table>
        <tr>
            <td class="diagonal">A1</td>
            <td>B1</td>
            <td>C2</td>
            <td class="vertical">D1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td class="diagonal">B2</td>
            <td>C2</td>
            <td class="vertical">D2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="diagonal">C3</td>
            <td class="vertical">D3</td>
        </tr>
        <tr>
            <td class="horizontal">A4</td>
            <td class="horizontal">B4</td>
            <td class="horizontal">C4</td>
            <td class="diagonal">D4</td>
        </tr>
    </table>
</body>
</html>
